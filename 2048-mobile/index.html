<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>2048 对战版 · 手机端</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">

<style>
  /* = 作品集对齐变量 = */
  :root {
    --bg:        #faf8f3;
    --bg-soft:   #f4f1ea;
    --text:      #1a1a1a;
    --text-soft: #5a5a5a;
    --text-faint:#9a968d;
    --accent:    #1f4a3a;
    --accent-soft:#e8efe9;
    --warm:      #b87333;
    --border:    #e3ddd0;
    --border-soft:#ece7da;

    --p1-color:  #1f4a3a;
    --p1-bg:     #e8efe9;
    --p2-color:  #b87333;
    --p2-bg:     #f5efe4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Source Serif 4", "LXGW WenKai", "Noto Serif SC", serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column; align-items: stretch;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    touch-action: none; overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* === 顶栏 === */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 2px 14px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 14px;
  }
  .brand {
    font-family: "Source Serif 4", serif;
    font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
  }
  .brand .accent { color: var(--accent); font-weight: 600; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--border); color: var(--text-soft);
    padding: 6px 12px; border-radius: 2px; font-weight: 500;
    -webkit-appearance: none; appearance: none; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .icon-btn:active { background: var(--bg-soft); border-color: var(--text); color: var(--text); }

  /* === 对手缩略 === */
  .opponent-bar {
    display: flex; gap: 12px; align-items: center;
    background: var(--bg-soft);
    padding: 10px 14px;
    border-radius: 2px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .opp-title {
    flex: 0 0 auto; display: flex; flex-direction: column;
    line-height: 1.25;
  }
  .opp-title b {
    font-family: "Source Serif 4", serif;
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  }
  .opp-title b.p1 { color: var(--p1-color); }
  .opp-title b.p2 { color: var(--p2-color); }
  .opp-title span {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .opp-score {
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    color: var(--text);
    font-size: 18px; letter-spacing: -0.01em;
  }
  .opp-score .lbl {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint); font-weight: 500; margin-right: 4px;
  }
  .opp-mini {
    flex: 1 1 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 2px; background: var(--bg); padding: 2px; border-radius: 2px;
    border: 1px solid var(--border-soft);
    min-height: 40px;
  }
  .opp-mini .mc {
    aspect-ratio: 1;
    border-radius: 1px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Serif 4", serif;
    font-size: 9px; font-weight: 600;
    color: var(--text-faint);
    background: var(--border-soft);
  }
  .opp-mini .mc.v2    { background:#eee4d6; color:#6b6358; }
  .opp-mini .mc.v4    { background:#e6dcc8; color:#6b6358; }
  .opp-mini .mc.v8    { background:#d4c4a0; color:#3d382f; }
  .opp-mini .mc.v16   { background:#c9b583; color:#3d382f; }
  .opp-mini .mc.v32   { background:#b8a262; color:#fff; }
  .opp-mini .mc.v64   { background:#a68d4a; color:#fff; }
  .opp-mini .mc.v128  { background:#8a9b7a; color:#fff; }
  .opp-mini .mc.v256  { background:#6e8665; color:#fff; }
  .opp-mini .mc.v512  { background:#576d53; color:#fff; }
  .opp-mini .mc.v1024 { background:#3f523d; color:#fff; }
  .opp-mini .mc.v2048 { background:#1f4a3a; color:#fff; }
  .opp-mini .mc.vbig  { background:#1f4a3a; color:#fff; }

  /* === 回合提示 === */
  .turn-indicator {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    text-align: center;
    padding: 4px 0 10px;
    color: var(--text-faint);
  }
  .turn-indicator.p1 { color: var(--p1-color); }
  .turn-indicator.p2 { color: var(--p2-color); }

  /* === 主棋盘 === */
  .main-wrap { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  .main-head {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; max-width: 400px; padding: 0 2px 8px;
  }
  .main-title {
    font-family: "Source Serif 4", serif;
    font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  }
  .main-title.p1 { color: var(--p1-color); }
  .main-title.p2 { color: var(--p2-color); }
  .main-score {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .main-score b {
    font-family: "Source Serif 4", serif;
    font-size: 19px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em; margin-left: 4px;
    text-transform: none;
  }

  .board {
    display: grid; grid-template-columns: repeat(4, 1fr);
    --gap: clamp(5px, 1.6vmin, 8px);
    gap: var(--gap);
    background: var(--bg-soft);
    padding: 8px; border-radius: 2px;
    width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
    border: 1px solid var(--p1-color);
    transition: border-color .25s;
  }
  .board.p2 { border-color: var(--p2-color); }

  .cell {
    background: var(--border-soft); border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: clamp(16px, 5.2vmin, 30px);
    letter-spacing: -0.01em;
  }
  .cell.pop { animation: pop .16s ease-out; }
  .cell.appear { animation: appear .2s ease-out; }
  @keyframes pop    { 0%{transform:scale(1)} 50%{transform:scale(1.14)} 100%{transform:scale(1)} }
  @keyframes appear { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
  .shake { animation: shake .2s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  .v2    { background:#eee4d6; color:#6b6358; }
  .v4    { background:#e6dcc8; color:#6b6358; }
  .v8    { background:#d4c4a0; color:#3d382f; }
  .v16   { background:#c9b583; color:#3d382f; }
  .v32   { background:#b8a262; color:#fff; }
  .v64   { background:#a68d4a; color:#fff; }
  .v128  { background:#8a9b7a; color:#fff; font-size: clamp(14px, 4.5vmin, 26px); }
  .v256  { background:#6e8665; color:#fff; font-size: clamp(14px, 4.5vmin, 26px); }
  .v512  { background:#576d53; color:#fff; font-size: clamp(14px, 4.5vmin, 26px); }
  .v1024 { background:#3f523d; color:#fff; font-size: clamp(12px, 4vmin, 22px); }
  .v2048 { background:#1f4a3a; color:#fff; font-size: clamp(12px, 4vmin, 22px); }
  .vbig  { background:#1f4a3a; color:#fff; }

  /* === 虚拟方向键 === */
  .dpad {
    margin-top: 14px;
    display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad button {
    font-family: "Source Serif 4", serif;
    font-size: 20px; font-weight: 500;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-soft);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; appearance: none; cursor: pointer;
    transition: background .1s, color .1s;
  }
  .dpad button:active { background: var(--bg-soft); border-color: var(--text); color: var(--text); }
  .dpad .blank { visibility: hidden; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  .hint {
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint); margin-top: 8px;
  }

  /* === 结束弹层 === */
  #globalOverlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(250, 248, 243, .94);
    backdrop-filter: blur(4px);
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #globalOverlay.show { opacity: 1; pointer-events: auto; }
  #globalOverlay .card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 36px 32px; text-align: center; min-width: 260px;
    margin: calc(env(safe-area-inset-top) + 20px);
  }
  #globalOverlay .big {
    font-family: "Source Serif 4", serif;
    font-size: 24px; font-weight: 500; letter-spacing: -0.02em;
    margin-bottom: 8px; color: var(--accent);
  }
  #globalOverlay .desc {
    font-family: "Source Serif 4", "LXGW WenKai", serif;
    font-style: italic;
    color: var(--text-soft); font-size: 13px;
    margin-bottom: 22px; line-height: 1.6;
  }
  #globalOverlay button {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: var(--text); color: var(--bg); border: none;
    padding: 10px 28px; border-radius: 2px; font-weight: 500;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  #globalOverlay button:active { background: var(--accent); }

  /* === 横屏 === */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding: 8px 10px; }
    .opponent-bar { padding: 6px 12px; margin-bottom: 8px; }
    .turn-indicator { padding: 2px 0 6px; font-size: 10px; }
    .main-head { padding: 0 2px 4px; }
    .dpad { margin-top: 6px; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 3px; }
    .hint { display: none; }
    .board { max-width: 360px; }
    .topbar { padding: 4px 2px 10px; margin-bottom: 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">2048 <span class="accent">对战</span> · 手机端</div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="reset()">再来一局</button>
  </div>
</div>

<div class="opponent-bar" id="oppBar" style="display:none;">
  <div class="opp-title">
    <b id="oppTitle">玩家 1</b>
    <span>对手</span>
  </div>
  <div class="opp-score"><span class="lbl">得分</span><b id="oppScore">0</b></div>
  <div class="opp-mini" id="oppMini"></div>
</div>

<div class="turn-indicator" id="turnInd"></div>

<div class="main-wrap">
  <div class="main-head">
    <span class="main-title" id="mainTitle"></span>
    <span class="main-score">得分 <b id="mainScore">0</b></span>
  </div>
  <div class="board" id="mainBoard"></div>

  <div class="dpad">
    <div class="blank"></div>
    <button class="up"    aria-label="上" ontouchstart="event.preventDefault();quickMove('up')"    onclick="quickMove('up')">↑</button>
    <div class="blank"></div>
    <button class="left"  aria-label="左" ontouchstart="event.preventDefault();quickMove('left')"  onclick="quickMove('left')">←</button>
    <div class="blank"></div>
    <button class="right" aria-label="右" ontouchstart="event.preventDefault();quickMove('right')" onclick="quickMove('right')">→</button>
    <div class="blank"></div>
    <button class="down"  aria-label="下" ontouchstart="event.preventDefault();quickMove('down')"  onclick="quickMove('down')">↓</button>
    <div class="blank"></div>
  </div>
  <div class="hint">棋盘上滑动 · 或点方向键</div>
</div>

<div id="globalOverlay">
  <div class="card">
    <div class="big" id="finalMsg"></div>
    <div class="desc" id="finalDesc"></div>
    <button onclick="reset()">再来一局</button>
  </div>
</div>

<script>
"use strict";
const SIZE = 4, WIN = 2048;
let players, current, gameOver;

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }
function spawn(grid){
  const empties = [];
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]===0) empties.push([r,c]);
  if (!empties.length) return null;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r,c];
}
function slideRowLeft(row){
  const tiles = row.filter(v => v !== 0);
  const out = []; let gained = 0; let mergedAt = -1;
  for (let i = 0; i < tiles.length; i++){
    if (i+1 < tiles.length && tiles[i] === tiles[i+1]){
      const v = tiles[i]*2; out.push(v); gained += v; mergedAt = out.length-1; i++;
    } else out.push(tiles[i]);
  }
  while (out.length < SIZE) out.push(0);
  return { row: out, gained, mergedAt };
}
function move(grid, dir){
  let gained = 0, changed = false, new2048 = false;
  const mergedCells = []; const ng = emptyGrid();
  for (let i = 0; i < SIZE; i++){
    let line = [], coords = [];
    for (let j = 0; j < SIZE; j++){
      if      (dir==="left")  { line.push(grid[i][j]);   coords.push([i,j]); }
      else if (dir==="right") { line.push(grid[i][SIZE-1-j]); coords.push([i,SIZE-1-j]); }
      else if (dir==="up")    { line.push(grid[j][i]);   coords.push([j,i]); }
      else                    { line.push(grid[SIZE-1-j][i]); coords.push([SIZE-1-j,i]); }
    }
    const res = slideRowLeft(line);
    if (res.row.join() !== line.join()) changed = true;
    gained += res.gained;
    if (res.mergedAt >= 0){ mergedCells.push(coords[res.mergedAt]); if (res.row[res.mergedAt] >= WIN) new2048 = true; }
    for (let j = 0; j < SIZE; j++){ const [r,c] = coords[j]; ng[r][c] = res.row[j]; }
  }
  return { grid: ng, gained, changed, mergedCells, new2048 };
}
function canMove(grid){
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c]===0) return true;
    if (c+1<SIZE && grid[r][c]===grid[r][c+1]) return true;
    if (r+1<SIZE && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

/* === UI === */
const mainBoard = document.getElementById("mainBoard");
const mainTitle = document.getElementById("mainTitle");
const mainScore = document.getElementById("mainScore");
const turnInd   = document.getElementById("turnInd");
const oppBar    = document.getElementById("oppBar");
const oppTitle  = document.getElementById("oppTitle");
const oppScore  = document.getElementById("oppScore");
const oppMini   = document.getElementById("oppMini");
const globalOverlay = document.getElementById("globalOverlay");

function valueClass(v){
  if (v === 0) return "";
  if (v <= 2048) return "v" + v;
  return "vbig";
}

function renderMain(playerId, mergedCells, spawnCell){
  const p = players[playerId];
  mainBoard.innerHTML = "";
  mainBoard.classList.toggle("p2", playerId === 2);
  mainTitle.classList.toggle("p2", playerId === 2);
  mainTitle.classList.toggle("p1", playerId === 1);
  mainTitle.textContent = "玩家 " + playerId;
  mainScore.textContent = p.score;

  const mergedSet = new Set((mergedCells||[]).map(([r,c])=>r+","+c));
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const cell = document.createElement("div");
    const v = p.grid[r][c];
    cell.className = "cell" + (v ? " " + valueClass(v) : "");
    if (v){
      cell.textContent = v;
      if (mergedSet.has(r+","+c)) cell.classList.add("pop");
      if (spawnCell && spawnCell[0]===r && spawnCell[1]===c) cell.classList.add("appear");
    }
    mainBoard.appendChild(cell);
  }
}

function renderOpponent(playerId){
  const p = players[playerId];
  oppBar.style.display = "flex";
  oppTitle.textContent = "玩家 " + playerId;
  oppTitle.querySelector('b').className = '';
  oppTitle.querySelector('b').classList.add(playerId === 1 ? 'p1' : 'p2');
  oppScore.textContent = p.score;
  oppMini.innerHTML = "";
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const mc = document.createElement("div");
    const v = p.grid[r][c];
    mc.className = "mc" + (v ? " " + valueClass(v) : "");
    mc.textContent = v || "";
    oppMini.appendChild(mc);
  }
}

function renderAll(){
  renderMain(current);
  renderOpponent(3 - current);
  renderTurn();
}

function renderTurn(){
  turnInd.className = "turn-indicator p" + current;
  if (gameOver) turnInd.textContent = "对战结束";
  else          turnInd.textContent = "轮到玩家 " + current + " 出招";
}

function handleMove(playerId, dir){
  if (gameOver || playerId !== current) return;
  const p = players[playerId];
  const result = move(p.grid, dir);

  if (!result.changed){
    mainBoard.classList.remove("shake"); void mainBoard.offsetWidth; mainBoard.classList.add("shake");
    return;
  }

  p.grid = result.grid;
  p.score += result.gained;
  const spawnCell = spawn(p.grid);
  renderMain(playerId, result.mergedCells, spawnCell);

  if (result.new2048) return endGame(playerId, "合成 " + WIN);
  if (!canMove(players[3-playerId].grid)) return endGame(playerId, "对手棋盘死局");
  if (!canMove(p.grid)) return endGame(3-playerId, "你的棋盘死局");

  current = 3 - current;
  renderAll();
}

function endGame(winnerId, reason){
  gameOver = true;
  renderTurn();
  document.getElementById("finalMsg").textContent = "玩家 " + winnerId + " 获胜";
  document.getElementById("finalDesc").textContent = reason + " ·  玩家 "+winnerId+" 得分 "+players[winnerId].score+" : "+players[3-winnerId].score;
  globalOverlay.classList.add("show");
}

function reset(){
  players = {
    1: { grid: emptyGrid(), score: 0 },
    2: { grid: emptyGrid(), score: 0 },
  };
  current = 1; gameOver = false;
  globalOverlay.classList.remove("show");
  spawn(players[1].grid); spawn(players[1].grid);
  spawn(players[2].grid); spawn(players[2].grid);
  renderAll();
}

const TOUCH_THRESHOLD = 18;
let touchStart = null;

mainBoard.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });

mainBoard.addEventListener("touchmove", e => {
  if (touchStart) e.preventDefault();
}, { passive: false });

mainBoard.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  touchStart = null;
  if (Math.max(absX, absY) < TOUCH_THRESHOLD) return;
  let dir;
  if (absX > absY) dir = dx > 0 ? "right" : "left";
  else             dir = dy > 0 ? "down"  : "up";
  handleMove(current, dir);
}, { passive: false });

function quickMove(dir){ handleMove(current, dir); }

const KEYMAP = {
  ArrowUp: [1,"up"], ArrowDown: [1,"down"], ArrowLeft: [1,"left"], ArrowRight: [1,"right"],
  KeyW: [2,"up"], KeyS: [2,"down"], KeyA: [2,"left"], KeyD: [2,"right"],
};
document.addEventListener("keydown", e => {
  const mapped = KEYMAP[e.code];
  if (!mapped) return;
  e.preventDefault();
  handleMove(mapped[0], mapped[1]);
});

reset();
</script>
</body>
</html>
