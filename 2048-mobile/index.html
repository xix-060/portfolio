<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>2048 对战版 · 手机端</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* === 基础 === */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #12141c; color: #e8e6e3;
    display: flex; flex-direction: column; align-items: stretch;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
    touch-action: none; /* 关键：阻止浏览器默认的滚动/缩放手势 */
    overscroll-behavior: none;
  }

  /* === 顶栏 === */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 4px 10px;
  }
  .brand {
    font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: #8a8f98;
  }
  .brand .accent { color: #f2b179; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: #1c1f2a; border: 1px solid #2a2e3c; color: #b0b6c0;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
  }
  .icon-btn:active { background: #2a2e3c; color: #fff; }

  /* === 对手缩略条 === */
  .opponent-bar {
    display: flex; gap: 10px; align-items: center;
    background: #1c1f2a; border: 1px solid #2a2e3c; border-radius: 12px;
    padding: 8px 12px; margin-bottom: 12px;
  }
  .opp-title {
    flex: 0 0 auto; display: flex; flex-direction: column;
    font-size: 12px; line-height: 1.3;
  }
  .opp-title b { font-size: 14px; color: #ffa94d; }
  .opp-title span { color: #8a8f98; }
  .opp-score {
    font-family: -apple-system, "Segoe UI", sans-serif; font-weight: 700;
    color: #e8e6e3; font-size: 16px;
  }
  .opp-score .lbl { font-size: 10px; color: #8a8f98; font-weight: 500; margin-right: 4px; }
  .opp-mini {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 2px; background: #2a2e3c; padding: 3px; border-radius: 6px;
    min-height: 38px;
  }
  .opp-mini .mc {
    aspect-ratio: 1; background: #262a38; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #b0b6c0;
  }
  .opp-mini .mc.v2    { background:#eee4da; color:#776e65; }
  .opp-mini .mc.v4    { background:#ede0c8; color:#776e65; }
  .opp-mini .mc.v8    { background:#f2b179; color:#fff; }
  .opp-mini .mc.v16   { background:#f59563; color:#fff; }
  .opp-mini .mc.v32   { background:#f67c5f; color:#fff; }
  .opp-mini .mc.v64   { background:#f65e3b; color:#fff; }
  .opp-mini .mc.v128  { background:#edcf72; color:#fff; }
  .opp-mini .mc.v256  { background:#edcc61; color:#fff; }
  .opp-mini .mc.v512  { background:#edc850; color:#fff; }
  .opp-mini .mc.v1024 { background:#edc53f; color:#fff; }
  .opp-mini .mc.v2048 { background:#edc22e; color:#fff; }
  .opp-mini .mc.vbig  { background:#3c3a32; color:#fff; }

  /* === 提示条（当前轮到谁） === */
  .turn-indicator {
    text-align: center; font-size: 13px; font-weight: 600;
    padding: 6px 0 12px; letter-spacing: 1px;
  }
  .turn-indicator.p1 { color: #7aa2ff; }
  .turn-indicator.p2 { color: #ffa94d; }

  /* === 主棋盘 === */
  .main-wrap { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .main-head {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; max-width: 400px; padding: 0 4px 8px;
  }
  .main-title { font-size: 17px; font-weight: 700; }
  .main-title.p1 { color: #7aa2ff; }
  .main-title.p2 { color: #ffa94d; }
  .main-score { font-size: 13px; color: #b0b6c0; }
  .main-score b { color: #fff; font-size: 18px; margin-left: 2px; }

  .board {
    --gap: clamp(6px, 2vmin, 10px);
    --pad: clamp(6px, 2vmin, 10px);
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: var(--gap); background: #1c1f2a; padding: var(--pad); border-radius: 12px;
    width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
    border: 2px solid #4c6ef5; transition: border-color .25s;
  }
  .board.p2 { border-color: #f76707; }
  .cell {
    background: #262a38; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(18px, 6vmin, 32px);
    transition: transform .12s;
  }
  .cell.pop { animation: pop .18s ease-out; }
  .cell.appear { animation: appear .2s ease-out; }
  @keyframes pop    { 0% { transform: scale(1);} 50% { transform: scale(1.18);} 100% { transform: scale(1);} }
  @keyframes appear { 0% { transform: scale(.3); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }
  .shake { animation: shake .25s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  .v2    { background:#eee4da; color:#776e65; }
  .v4    { background:#ede0c8; color:#776e65; }
  .v8    { background:#f2b179; color:#fff; }
  .v16   { background:#f59563; color:#fff; }
  .v32   { background:#f67c5f; color:#fff; }
  .v64   { background:#f65e3b; color:#fff; }
  .v128  { background:#edcf72; color:#fff; font-size: clamp(16px, 5vmin, 28px); }
  .v256  { background:#edcc61; color:#fff; font-size: clamp(16px, 5vmin, 28px); }
  .v512  { background:#edc850; color:#fff; font-size: clamp(16px, 5vmin, 28px); }
  .v1024 { background:#edc53f; color:#fff; font-size: clamp(14px, 4.5vmin, 24px); }
  .v2048 { background:#edc22e; color:#fff; font-size: clamp(14px, 4.5vmin, 24px); box-shadow:0 0 18px #edc22e88; }
  .vbig  { background:#3c3a32; color:#fff; }

  /* === 虚拟方向键 === */
  .dpad {
    margin-top: 16px;
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .dpad button {
    background: #1c1f2a; border: 1px solid #2a2e3c; color: #e8e6e3;
    border-radius: 10px; font-size: 22px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .dpad button:active { background: #2a2e3c; transform: scale(.95); }
  .dpad .blank { visibility: hidden; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  .hint { text-align: center; color: #5a5f68; font-size: 11px; margin-top: 10px; }

  /* === 结束弹层 === */
  #globalOverlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10,11,16,.85); backdrop-filter: blur(6px);
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #globalOverlay.show { opacity: 1; pointer-events: auto; }
  #globalOverlay .card {
    background: #1c1f2a; border: 1px solid #3a3f52; border-radius: 16px;
    padding: 36px 32px; text-align: center; min-width: 260px;
    margin: calc(env(safe-area-inset-top) + 20px);
  }
  #globalOverlay .big { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  #globalOverlay .desc { color: #b0b6c0; font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
  #globalOverlay button {
    background: #f76707; color: #fff; border: none; padding: 10px 32px;
    border-radius: 10px; font-size: 14px; font-weight: 600;
  }
  #globalOverlay button:active { filter: brightness(1.15); }

  /* === 横屏适配 === */
  @media (orientation: landscape) and (max-height: 500px) {
    body { padding: 8px 10px; }
    .opponent-bar { padding: 4px 10px; margin-bottom: 6px; }
    .turn-indicator { padding: 2px 0 6px; font-size: 11px; }
    .main-head { padding: 0 4px 4px; }
    .dpad { margin-top: 8px; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
    .hint { display: none; }
    .board { max-width: 360px; }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="brand">2048 <span class="accent">对战</span> · 手机端</div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="reset()">↻ 重开</button>
  </div>
</div>

<!-- 对手缩略 -->
<div class="opponent-bar" id="oppBar" style="display:none;">
  <div class="opp-title">
    <b id="oppTitle">玩家 1</b>
    <span style="color:#ffa94d;">对手</span>
  </div>
  <div class="opp-score"><span class="lbl">得分</span><b id="oppScore">0</b></div>
  <div class="opp-mini" id="oppMini"></div>
</div>

<!-- 当前回合提示 -->
<div class="turn-indicator" id="turnInd">轮到 玩家 1 出招</div>

<!-- 主棋盘 + 虚拟方向键 -->
<div class="main-wrap">
  <div class="main-head">
    <span class="main-title" id="mainTitle">玩家 1</span>
    <span class="main-score">得分 <b id="mainScore">0</b></span>
  </div>
  <div class="board" id="mainBoard"></div>

  <div class="dpad">
    <div class="blank"></div>
    <button class="up"    aria-label="上" ontouchstart="event.preventDefault();quickMove('up')"    onclick="quickMove('up')">↑</button>
    <div class="blank"></div>
    <button class="left"  aria-label="左" ontouchstart="event.preventDefault();quickMove('left')"  onclick="quickMove('left')">←</button>
    <div class="blank"></div>
    <button class="right" aria-label="右" ontouchstart="event.preventDefault();quickMove('right')" onclick="quickMove('right')">→</button>
    <div class="blank"></div>
    <button class="down"  aria-label="下" ontouchstart="event.preventDefault();quickMove('down')"  onclick="quickMove('down')">↓</button>
    <div class="blank"></div>
  </div>
  <div class="hint">在棋盘上滑动 · 或点方向键</div>
</div>

<!-- 结束弹层 -->
<div id="globalOverlay">
  <div class="card">
    <div class="big" id="finalMsg"></div>
    <div class="desc" id="finalDesc"></div>
    <button onclick="reset()">再来一局</button>
  </div>
</div>

<script>
"use strict";
/* =========================================================
 * 核心游戏逻辑 —— 与电脑版 2048-battle/index.html 逐字一致
 * ========================================================= */
const SIZE = 4, WIN = 2048;
let players, current, gameOver;

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

function spawn(grid){
  const empties = [];
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]===0) empties.push([r,c]);
  if (!empties.length) return null;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r,c];
}

function slideRowLeft(row){
  const tiles = row.filter(v => v !== 0);
  const out = []; let gained = 0; let mergedAt = -1;
  for (let i = 0; i < tiles.length; i++){
    if (i+1 < tiles.length && tiles[i] === tiles[i+1]){
      const v = tiles[i]*2;
      out.push(v); gained += v; mergedAt = out.length-1;
      i++;
    } else out.push(tiles[i]);
  }
  while (out.length < SIZE) out.push(0);
  return { row: out, gained, mergedAt };
}

function move(grid, dir){
  let gained = 0, changed = false, new2048 = false;
  const mergedCells = []; const ng = emptyGrid();
  for (let i = 0; i < SIZE; i++){
    let line = [], coords = [];
    for (let j = 0; j < SIZE; j++){
      if      (dir==="left")  { line.push(grid[i][j]);   coords.push([i,j]); }
      else if (dir==="right") { line.push(grid[i][SIZE-1-j]); coords.push([i,SIZE-1-j]); }
      else if (dir==="up")    { line.push(grid[j][i]);   coords.push([j,i]); }
      else                    { line.push(grid[SIZE-1-j][i]); coords.push([SIZE-1-j,i]); }
    }
    const res = slideRowLeft(line);
    if (res.row.join() !== line.join()) changed = true;
    gained += res.gained;
    if (res.mergedAt >= 0){
      mergedCells.push(coords[res.mergedAt]);
      if (res.row[res.mergedAt] >= WIN) new2048 = true;
    }
    for (let j = 0; j < SIZE; j++){
      const [r,c] = coords[j];
      ng[r][c] = res.row[j];
    }
  }
  return { grid: ng, gained, changed, mergedCells, new2048 };
}

function canMove(grid){
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c]===0) return true;
    if (c+1<SIZE && grid[r][c]===grid[r][c+1]) return true;
    if (r+1<SIZE && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

/* =========================================================
 * 手机版 UI 层 —— 轮播式主棋盘
 * ========================================================= */
const mainBoard   = document.getElementById("mainBoard");
const mainTitle   = document.getElementById("mainTitle");
const mainScore   = document.getElementById("mainScore");
const turnInd     = document.getElementById("turnInd");
const oppBar      = document.getElementById("oppBar");
const oppTitle    = document.getElementById("oppTitle");
const oppScore    = document.getElementById("oppScore");
const oppMini     = document.getElementById("oppMini");
const globalOverlay = document.getElementById("globalOverlay");

function valueClass(v){
  if (v === 0) return "";
  if (v <= 2048) return "v" + v;
  return "vbig";
}

function renderMain(playerId, mergedCells, spawnCell){
  const p = players[playerId];
  mainBoard.innerHTML = "";
  mainBoard.classList.toggle("p2", playerId === 2);
  mainTitle.classList.toggle("p2", playerId === 2);
  mainTitle.classList.toggle("p1", playerId === 1);
  mainTitle.textContent = "玩家 " + playerId;
  mainScore.textContent = p.score;

  const mergedSet = new Set((mergedCells||[]).map(([r,c])=>r+","+c));
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const cell = document.createElement("div");
    const v = p.grid[r][c];
    cell.className = "cell" + (v ? " " + valueClass(v) : "");
    if (v){
      cell.textContent = v;
      if (mergedSet.has(r+","+c)) cell.classList.add("pop");
      if (spawnCell && spawnCell[0]===r && spawnCell[1]===c) cell.classList.add("appear");
    }
    mainBoard.appendChild(cell);
  }
}

function renderOpponent(playerId){
  // playerId = 对手ID
  const p = players[playerId];
  oppBar.style.display = "flex";
  oppTitle.textContent = "玩家 " + playerId;
  oppTitle.style.color = playerId === 1 ? "#7aa2ff" : "#ffa94d";
  oppScore.textContent = p.score;
  oppMini.innerHTML = "";
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const mc = document.createElement("div");
    const v = p.grid[r][c];
    mc.className = "mc" + (v ? " " + valueClass(v) : "");
    mc.textContent = v || "";
    oppMini.appendChild(mc);
  }
}

function renderAll(){
  renderMain(current);
  renderOpponent(3 - current);
  renderTurn();
}

function renderTurn(){
  turnInd.className = "turn-indicator p" + current;
  if (gameOver) turnInd.textContent = "对战结束";
  else          turnInd.textContent = "轮到 玩家 " + current + " 出招";
}

/* =========================================================
 * 游戏流程 —— handleMove 核心逻辑与电脑版逐字一致
 * ========================================================= */
function handleMove(playerId, dir){
  if (gameOver || playerId !== current) return;
  const p = players[playerId];
  const result = move(p.grid, dir);

  if (!result.changed){
    mainBoard.classList.remove("shake"); void mainBoard.offsetWidth; mainBoard.classList.add("shake");
    return;
  }

  p.grid = result.grid;
  p.score += result.gained;
  const spawnCell = spawn(p.grid);
  renderMain(playerId, result.mergedCells, spawnCell);

  if (result.new2048) return endGame(playerId, "合成 " + WIN + "！");
  if (!canMove(players[3-playerId].grid)) return endGame(playerId, "对手棋盘死局");
  if (!canMove(p.grid)) return endGame(3-playerId, "你的棋盘死局");

  current = 3 - current;
  renderAll();
}

function endGame(winnerId, reason){
  gameOver = true;
  renderTurn();
  document.getElementById("finalMsg").textContent = "🏆 玩家 " + winnerId + " 获胜！";
  document.getElementById("finalDesc").textContent = reason + "  ·  P" + winnerId + " 得分 " + players[winnerId].score + " : " + players[3-winnerId].score;
  globalOverlay.classList.add("show");
}

function reset(){
  players = {
    1: { grid: emptyGrid(), score: 0 },
    2: { grid: emptyGrid(), score: 0 },
  };
  current = 1; gameOver = false;
  globalOverlay.classList.remove("show");
  spawn(players[1].grid); spawn(players[1].grid);
  spawn(players[2].grid); spawn(players[2].grid);
  renderAll();
}

/* =========================================================
 * 输入层 —— 触摸滑动 / 虚拟按键 / 桌面键盘
 * ========================================================= */
const TOUCH_THRESHOLD = 18; // 像素阈值
let touchStart = null;

// 触摸滑动
mainBoard.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });

mainBoard.addEventListener("touchmove", e => {
  if (touchStart) e.preventDefault();
}, { passive: false });

mainBoard.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  touchStart = null;

  if (Math.max(absX, absY) < TOUCH_THRESHOLD) return;
  let dir;
  if (absX > absY) dir = dx > 0 ? "right" : "left";
  else             dir = dy > 0 ? "down"  : "up";
  handleMove(current, dir);
}, { passive: false });

// 虚拟按键
function quickMove(dir){
  handleMove(current, dir);
}

// 桌面键盘（调试用）
const KEYMAP = {
  ArrowUp: [1,"up"], ArrowDown: [1,"down"], ArrowLeft: [1,"left"], ArrowRight: [1,"right"],
  KeyW: [2,"up"], KeyS: [2,"down"], KeyA: [2,"left"], KeyD: [2,"right"],
};
document.addEventListener("keydown", e => {
  const mapped = KEYMAP[e.code];
  if (!mapped) return;
  e.preventDefault();
  handleMove(mapped[0], mapped[1]);
});

reset();
</script>
</body>
</html>
