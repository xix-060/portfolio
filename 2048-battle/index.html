<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 对战版 · 双人轮流制</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">

<style>
  /* = 作品集对齐变量 = */
  :root {
    --bg:        #faf8f3;
    --bg-soft:   #f4f1ea;
    --text:      #1a1a1a;
    --text-soft: #5a5a5a;
    --text-faint:#9a968d;
    --accent:    #1f4a3a;
    --accent-soft:#e8efe9;
    --warm:      #b87333;
    --border:    #e3ddd0;
    --border-soft:#ece7da;

    --p1-color:  #1f4a3a;        /* 玩家一：墨绿 */
    --p1-bg:     #e8efe9;
    --p2-color:  #b87333;        /* 玩家二：金属金 */
    --p2-bg:     #f5efe4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  html { scroll-behavior: smooth; }

  body {
    font-family: "Source Serif 4", "LXGW WenKai", "Noto Serif SC", serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 24px 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* === 顶部导航 === */
  .top-row {
    width: 100%; max-width: 960px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .back-link {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-faint); text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    transition: color .2s, border-color .2s;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .brand {
    font-family: "Source Serif 4", serif;
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--text-soft);
  }

  /* === Header === */
  header { text-align: center; margin-bottom: 24px; }
  h1 {
    font-family: "Source Serif 4", serif;
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 500; letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 .accent { color: var(--accent); font-weight: 600; }
  .sub {
    font-family: "Source Serif 4", "LXGW WenKai", serif;
    font-style: italic;
    color: var(--text-soft);
    font-size: 14px;
    margin-top: 8px;
  }

  /* === 回合指示 === */
  .turn-bar {
    display: flex; align-items: center; gap: 20px;
    background: var(--bg-soft);
    padding: 10px 22px;
    border-radius: 2px;
    border: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .turn-chip {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--text-faint);
    opacity: .45;
    transition: all .25s ease;
  }
  .turn-chip.active { opacity: 1; }
  #chip1.active {
    background: var(--p1-bg); border-color: var(--p1-color); color: var(--p1-color);
    font-weight: 600;
  }
  #chip2.active {
    background: var(--p2-bg); border-color: var(--p2-color); color: var(--p2-color);
    font-weight: 600;
  }
  .vs {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-faint);
  }

  /* === 双棋盘 === */
  .boards {
    display: flex; gap: 36px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 24px;
  }
  .board-wrap { position: relative; }
  .board-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 2px 10px;
  }
  .board-title {
    font-family: "Source Serif 4", serif;
    font-weight: 600; font-size: 16px;
    letter-spacing: -0.01em;
  }
  #t1 { color: var(--p1-color); }
  #t2 { color: var(--p2-color); }
  .score {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .score b {
    font-family: "Source Serif 4", serif;
    font-size: 18px; color: var(--text);
    font-weight: 600; letter-spacing: -0.01em;
    margin-left: 4px;
    text-transform: none;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    gap: 8px;
    background: var(--bg-soft);
    padding: 8px;
    border-radius: 2px;
    border: 1px solid var(--border);
    transition: border-color .25s;
  }
  .board.active-p1 { border-color: var(--p1-color); }
  .board.active-p2 { border-color: var(--p2-color); }
  .board.dim { opacity: .5; }

  .cell {
    width: 80px; height: 80px;
    border-radius: 2px;
    background: var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    transition: transform .1s ease;
  }
  .cell.pop { animation: pop .16s ease-out; }
  .cell.appear { animation: appear .2s ease-out; }
  @keyframes pop    { 0%{transform:scale(1)} 50%{transform:scale(1.14)} 100%{transform:scale(1)} }
  @keyframes appear { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
  .shake { animation: shake .2s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* 方块配色：低饱和暖米 / 墨绿 / 金 */
  .v2    { background: #eee4d6; color: #6b6358; }
  .v4    { background: #e6dcc8; color: #6b6358; }
  .v8    { background: #d4c4a0; color: #3d382f; }
  .v16   { background: #c9b583; color: #3d382f; }
  .v32   { background: #b8a262; color: #fff; }
  .v64   { background: #a68d4a; color: #fff; }
  .v128  { background: #8a9b7a; color: #fff; font-size: 20px; }
  .v256  { background: #6e8665; color: #fff; font-size: 20px; }
  .v512  { background: #576d53; color: #fff; font-size: 20px; }
  .v1024 { background: #3f523d; color: #fff; font-size: 17px; }
  .v2048 { background: var(--accent); color: #fff; font-size: 17px; }
  .vbig  { background: var(--accent); color: #fff; }

  /* === 键盘提示 === */
  .keys {
    display: flex; gap: 48px; margin-top: 16px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .keys kbd {
    background: transparent;
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 2px;
    margin: 0 2px;
    font-family: inherit;
    font-size: 10px;
    color: var(--text-soft);
  }
  .keys .k1 kbd { border-color: var(--p1-color); color: var(--p1-color); }
  .keys .k2 kbd { border-color: var(--p2-color); color: var(--p2-color); }

  /* === 结束弹层 === */
  #globalOverlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(250, 248, 243, .92);
    backdrop-filter: blur(6px);
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #globalOverlay.show { opacity: 1; pointer-events: auto; }
  #globalOverlay .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 40px 56px;
    text-align: center;
  }
  #globalOverlay .big {
    font-family: "Source Serif 4", serif;
    font-size: 28px; font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    color: var(--accent);
  }
  #globalOverlay .desc {
    font-family: "Source Serif 4", "LXGW WenKai", serif;
    font-style: italic;
    color: var(--text-soft); font-size: 14px;
    margin-bottom: 24px;
  }
  #globalOverlay button {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: var(--text);
    color: var(--bg);
    border: none; padding: 10px 28px;
    border-radius: 2px; font-weight: 500;
    cursor: pointer;
    transition: background .2s;
  }
  #globalOverlay button:hover { background: var(--accent); }

  /* === 响应式 === */
  @media (max-width: 900px) {
    body { padding: 24px 16px 36px; }
    .boards { gap: 24px; }
    .board { grid-template-columns: repeat(4, 68px); }
    .cell { width: 68px; height: 68px; font-size: 20px; }
    .v128, .v256, .v512 { font-size: 17px; }
    .v1024, .v2048 { font-size: 14px; }
    .keys { gap: 24px; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: repeat(4, 58px); gap: 6px; padding: 6px; }
    .cell { width: 58px; height: 58px; font-size: 18px; }
    .v128, .v256, .v512 { font-size: 15px; }
    .v1024, .v2048 { font-size: 12px; }
    .boards { gap: 20px; }
    .turn-bar { padding: 8px 16px; gap: 14px; }
  }
</style>
</head>
<body>

<div class="top-row">
  <a class="back-link" href="../">← 返回作品集</a>
  <div class="brand">Mou Shengxi</div>
</div>

<header>
  <h1>2048 <span class="accent">对战版</span></h1>
  <div class="sub">双人轮流制 · 先合成 2048，或把对手逼入死局者胜</div>
</header>

<div class="turn-bar">
  <span id="chip1" class="turn-chip">玩家 1</span>
  <span class="vs">vs</span>
  <span id="chip2" class="turn-chip">玩家 2</span>
</div>

<div class="boards">
  <div class="board-wrap" id="wrap1">
    <div class="board-head">
      <span class="board-title" id="t1">玩家 1</span>
      <span class="score">得分 <b id="score1">0</b></span>
    </div>
    <div class="board" id="board1"></div>
    <div class="overlay" id="over1"><div class="big"></div><div class="desc"></div></div>
  </div>
  <div class="board-wrap" id="wrap2">
    <div class="board-head">
      <span class="board-title" id="t2">玩家 2</span>
      <span class="score">得分 <b id="score2">0</b></span>
    </div>
    <div class="board" id="board2"></div>
    <div class="overlay" id="over2"><div class="big"></div><div class="desc"></div></div>
  </div>
</div>

<div class="keys">
  <span class="k1">玩家一 · 方向键 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span>
  <span class="k2">玩家二 · WASD <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
</div>

<div id="globalOverlay"><div class="card">
  <div class="big" id="finalMsg"></div>
  <div class="desc" id="finalDesc"></div>
  <button onclick="reset()">再来一局</button>
</div></div>

<script>
"use strict";
const SIZE = 4, WIN = 2048;
let players, current, gameOver;

const KEYMAP = {
  ArrowUp: [1,"up"], ArrowDown: [1,"down"], ArrowLeft: [1,"left"], ArrowRight: [1,"right"],
  KeyW: [2,"up"], KeyS: [2,"down"], KeyA: [2,"left"], KeyD: [2,"right"],
};

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

function spawn(grid){
  const empties = [];
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]===0) empties.push([r,c]);
  if (!empties.length) return null;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r,c];
}

function slideRowLeft(row){
  const tiles = row.filter(v => v !== 0);
  const out = []; let gained = 0; let mergedAt = -1;
  for (let i = 0; i < tiles.length; i++){
    if (i+1 < tiles.length && tiles[i] === tiles[i+1]){
      const v = tiles[i]*2;
      out.push(v); gained += v; mergedAt = out.length-1;
      i++;
    } else out.push(tiles[i]);
  }
  while (out.length < SIZE) out.push(0);
  return { row: out, gained, mergedAt };
}

function move(grid, dir){
  let gained = 0, changed = false, new2048 = false;
  const mergedCells = [];
  const ng = emptyGrid();

  for (let i = 0; i < SIZE; i++){
    let line = [], coords = [];
    for (let j = 0; j < SIZE; j++){
      if      (dir==="left")  { line.push(grid[i][j]);   coords.push([i,j]); }
      else if (dir==="right") { line.push(grid[i][SIZE-1-j]); coords.push([i,SIZE-1-j]); }
      else if (dir==="up")    { line.push(grid[j][i]);   coords.push([j,i]); }
      else                    { line.push(grid[SIZE-1-j][i]); coords.push([SIZE-1-j,i]); }
    }
    const res = slideRowLeft(line);
    if (res.row.join() !== line.join()) changed = true;
    gained += res.gained;
    if (res.mergedAt >= 0){
      mergedCells.push(coords[res.mergedAt]);
      if (res.row[res.mergedAt] >= WIN) new2048 = true;
    }
    for (let j = 0; j < SIZE; j++){
      const [r,c] = coords[j];
      ng[r][c] = res.row[j];
    }
  }
  return { grid: ng, gained, changed, mergedCells, new2048 };
}

function canMove(grid){
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c]===0) return true;
    if (c+1<SIZE && grid[r][c]===grid[r][c+1]) return true;
    if (r+1<SIZE && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

const boardEls = {1: document.getElementById("board1"), 2: document.getElementById("board2")};
const scoreEls = {1: document.getElementById("score1"), 2: document.getElementById("score2")};

function valueClass(v){
  if (v===0) return "";
  if (v<=2048) return "v"+v;
  return "vbig";
}

function render(playerId, mergedCells, spawnCell){
  const p = players[playerId];
  const board = boardEls[playerId];
  board.innerHTML = "";
  const mergedSet = new Set((mergedCells||[]).map(([r,c])=>r+","+c));
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    const cell = document.createElement("div");
    const v = p.grid[r][c];
    cell.className = "cell" + (v ? " "+valueClass(v) : "");
    if (v){
      cell.textContent = v;
      if (mergedSet.has(r+","+c)) cell.classList.add("pop");
      if (spawnCell && spawnCell[0]===r && spawnCell[1]===c) cell.classList.add("appear");
    }
    board.appendChild(cell);
  }
  scoreEls[playerId].textContent = p.score;
}

function renderTurn(){
  document.getElementById("chip1").classList.toggle("active", current===1 && !gameOver);
  document.getElementById("chip2").classList.toggle("active", current===2 && !gameOver);
  boardEls[1].className = "board" + (!gameOver && current===1 ? " active-p1" : " dim");
  boardEls[2].className = "board" + (!gameOver && current===2 ? " active-p2" : " dim");
}

function handleMove(playerId, dir){
  if (gameOver || playerId !== current) return;
  const p = players[playerId];
  const result = move(p.grid, dir);

  if (!result.changed){
    const b = boardEls[playerId];
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    return;
  }

  p.grid = result.grid;
  p.score += result.gained;
  const spawnCell = spawn(p.grid);
  render(playerId, result.mergedCells, spawnCell);

  if (result.new2048) return endGame(playerId, "合成 "+WIN+"");
  if (!canMove(players[3-playerId].grid)) return endGame(playerId, "对手棋盘死局");
  if (!canMove(p.grid)) return endGame(3-playerId, "你的棋盘死局");

  current = 3 - current;
  renderTurn();
}

function endGame(winnerId, reason){
  gameOver = true;
  renderTurn();
  const ov = document.getElementById("globalOverlay");
  document.getElementById("finalMsg").textContent = "玩家 "+winnerId+" 获胜";
  document.getElementById("finalDesc").textContent = reason + " ·  玩家 "+winnerId+" 得分 "+players[winnerId].score+" : "+players[3-winnerId].score;
  ov.classList.add("show");
}

function reset(){
  players = {
    1: { grid: emptyGrid(), score: 0 },
    2: { grid: emptyGrid(), score: 0 },
  };
  current = 1; gameOver = false;
  document.getElementById("globalOverlay").classList.remove("show");
  spawn(players[1].grid); spawn(players[1].grid);
  spawn(players[2].grid); spawn(players[2].grid);
  render(1); render(2); renderTurn();
}

document.addEventListener("keydown", e => {
  const mapped = KEYMAP[e.code];
  if (!mapped) return;
  e.preventDefault();
  handleMove(mapped[0], mapped[1]);
});

reset();
</script>
</body>
</html>
